# Сайт на GitHub Pages: https://xrnskew.github.io/hitbox/ или свой домен (Settings → Pages → Custom domain).
# Собирает сайт при пуше в main и выкладывает его.
# Рядом с сайтом кладёт hitbox.html — версию одним файлом для работы без интернета.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# одна выкладка за раз; новая отменяет недоделанную
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Где живёт сайт: без своего домена — в подпапке (base_path = '/hitbox'),
      # со своим доменом — в корне (base_path пустой). Pages знает это сам.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Сайт для Pages
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Версия одним файлом
        run: |
          npm run build:single
          cp dist-single/hitbox.html dist/hitbox.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # тот же файл — для скачивания со страницы запуска в Actions
      - uses: actions/upload-artifact@v4
        with:
          name: hitbox
          path: dist-single/hitbox.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
