# Проверки и сайт на GitHub Pages: https://hitbox.space (или https://xrnskew.github.io/hitbox/ без своего домена).
# При пуше в dev — только проверки и пробная сборка. При пуше в main — проверки, сборка и выкладка;
# если проверки красные, сайт не меняется.
# Рядом с сайтом кладёт hitbox.html — версию одним файлом для работы без интернета.
name: GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# одна выкладка за раз на ветку; новая отменяет недоделанную
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # в main попадает только то, что уже есть в dev (docs/MAIN.md)
      - name: Коммит есть в dev
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          git merge-base --is-ancestor HEAD origin/dev || {
            echo "::error::Коммита $GITHUB_SHA нет в dev. Сначала git push origin dev, потом git push origin dev:main."
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Типы и сборка
        run: npm run build

      - name: Юнит-тесты
        run: npm test

      - name: Браузер для сквозных проверок
        run: npx playwright install --with-deps chromium

      - name: Сквозные проверки
        run: npm run test:e2e

      # упал сквозной тест — запись шагов (trace) можно скачать со страницы запуска
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7

  build:
    name: Сборка
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Где живёт сайт: без своего домена — в подпапке (base_path = '/hitbox'),
      # со своим доменом — в корне (base_path пустой). Pages знает это сам.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Сайт для Pages
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Версия одним файлом
        run: |
          npm run build:single
          cp dist-single/hitbox.html dist/hitbox.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # тот же файл — для скачивания со страницы запуска в Actions
      - uses: actions/upload-artifact@v7
        with:
          name: hitbox
          path: dist-single/hitbox.html

  deploy:
    name: Выкладка
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
